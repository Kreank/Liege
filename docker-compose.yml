services:
  postgres:
    image: postgres:16-alpine
    container_name: liege-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: liege
      POSTGRES_USER: liege
      POSTGRES_PASSWORD: liege
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liege -d liege"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: liege-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - DATABASE_URL=postgresql://liege:liege@postgres:5432/liege
      # Welle 53 — World-Reset 2026-06-06: neuer Seed = komplett neue Landkarte.
      # Charaktere/Accounts/Inventare bleiben; Position wird beim Login via
      # find_spawn auf ein gültiges Tile gesetzt (load_or_create_player).
      - WORLD_SEED=20260606
      # SESSION_SECRET muss vom Host gesetzt sein (z.B. .env oder Override).
      # auth.py wirft beim ersten Auth-Call RuntimeError wenn leer.
      - SESSION_SECRET=${SESSION_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

volumes:
  postgres-data:
    name: liege-postgres-data
