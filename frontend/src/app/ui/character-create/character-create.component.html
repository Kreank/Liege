@if (visible()) {
  <div class="cc-overlay" role="dialog" aria-modal="true" aria-labelledby="cc-title">
    <div class="cc-card">
      <h2 class="cc-title" id="cc-title">Charakter erstellen</h2>
      <p class="cc-subtitle">
        Wähle einen Namen und ein Erscheinungsbild — du kannst nicht zurück.
      </p>

      <div class="cc-field">
        <label class="cc-label" for="cc-name">Name</label>
        <div class="cc-name-row">
          <input
            id="cc-name"
            class="cc-name-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            maxlength="24"
            [value]="name()"
            (input)="onNameInput($any($event.target).value)"
          />
          <span
            class="cc-name-icon"
            [class.ok]="nameStatus() === 'ok'"
            [class.bad]="nameStatus() === 'taken' || nameStatus() === 'invalid'"
            [class.busy]="nameStatus() === 'checking'"
          >{{ statusIcon() }}</span>
        </div>
        @if (nameError(); as err) {
          <div class="cc-name-error">{{ err }}</div>
        }
      </div>

      <div class="cc-field">
        <div class="cc-label">Erscheinungsbild</div>
        <div class="cc-preset-grid">
          @for (p of presets; track p.key) {
            <button
              type="button"
              class="cc-preset-card"
              [class.selected]="selectedPreset() === p.key"
              (click)="selectPreset(p.key)"
            >
              <img
                class="cc-preset-preview"
                [src]="p.preview"
                [alt]="p.label"
                draggable="false"
              />
              <div class="cc-preset-label">{{ p.label }}</div>
            </button>
          }
        </div>
      </div>

      <div class="cc-actions">
        <button
          type="button"
          class="cc-submit"
          [disabled]="!canSubmit()"
          (click)="createCharacter()"
        >
          @if (creating()) {
            Erstelle …
          } @else {
            Charakter erstellen
          }
        </button>
      </div>
    </div>
  </div>
}
