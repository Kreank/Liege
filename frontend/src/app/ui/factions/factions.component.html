@if (visible()) {
  <div class="factions-overlay" (click)="close()">
    <div class="factions-box" (click)="$event.stopPropagation()">
      <div class="factions-header">
        <span>⚖️ Faktionen</span>
        <button type="button" class="factions-close" (click)="close()">F / Esc</button>
      </div>
      <div class="factions-list">
        @if (rows().length === 0) {
          <div class="factions-empty">Keine Faktion-Beziehungen.</div>
        }
        @for (row of rows(); track row.faction_id) {
          <div class="faction-row">
            <div class="faction-dot" [class]="'tier-' + row.tier"></div>
            <div class="faction-name">{{ row.displayName }}</div>
            <div class="faction-bar">
              @if (row.positive) {
                <div class="faction-bar-fill faction-bar-fill--pos"
                     [style.left.%]="50" [style.width.%]="row.barPct"></div>
              } @else {
                <div class="faction-bar-fill faction-bar-fill--neg"
                     [style.right.%]="50" [style.width.%]="row.barPct"></div>
              }
            </div>
            <div class="faction-tier" [class]="row.tier">
              {{ row.tierLabel }} {{ row.goodwill >= 0 ? '+' : '' }}{{ row.goodwill }}
            </div>
          </div>
        }
      </div>
    </div>
  </div>
}
